<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Inference Server</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #EEF2F4;
    --panel: #FFFFFF;
    --ink: #13242E;
    --muted: #566A76;
    --line: #D3DDE3;
    --accent: #0E6F8E;
    --accent-ink: #FFFFFF;
    --ok: #1F7A4D;
    --ok-bg: #E3F3EA;
    --bad: #B8362A;
    --bad-bg: #FBE7E4;
    --neutral: #3F5663;
    --neutral-bg: #E8EDF0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1A21;
      --panel: #16252E;
      --ink: #E6EEF2;
      --muted: #93A8B4;
      --line: #2A3C47;
      --accent: #4DB6D6;
      --accent-ink: #06222D;
      --ok: #5CCB93;
      --ok-bg: #12372A;
      --bad: #FF8A7A;
      --bad-bg: #40201C;
      --neutral: #B6C6CF;
      --neutral-bg: #22323B;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }

  .top {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 4px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 28px;
  }
  .top h1 { margin: 0; font-size: 1.55rem; font-weight: 650; letter-spacing: -0.01em; }
  .top p { margin: 0; flex: 1 1 320px; max-width: 62ch; color: var(--muted); }
  .top a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }

  .layout {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 20px 56px;
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }

  /* ---- Left rail: choices + result ---- */
  .rail {
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow: auto;
    display: grid;
    gap: 18px;
    padding: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .rail label, .field label { display: block; font-weight: 600; font-size: 0.82rem; margin-bottom: 4px; }
  .rail .group-title { font-weight: 600; font-size: 0.82rem; margin: 0 0 6px; }
  .hint { font-size: 0.78rem; color: var(--muted); margin: 4px 0 0; }

  select, input[type="number"], textarea {
    width: 100%;
    padding: 8px 10px;
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  textarea { resize: vertical; min-height: 7.5em; line-height: 1.45; }

  button {
    font: inherit;
    cursor: pointer;
    padding: 9px 14px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  button:hover { border-color: var(--accent); }
  .actions { display: flex; gap: 8px; }
  button.primary {
    flex: 1;
    font-weight: 650;
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }
  button.primary[disabled] { opacity: 0.65; cursor: progress; }
  .samples { display: flex; flex-wrap: wrap; gap: 8px; }
  .samples button { padding: 6px 10px; font-size: 0.85rem; }

  /* ---- Result ---- */
  .empty { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .verdict { border: 1px solid; border-radius: 8px; padding: 14px 14px 16px; }
  .verdict.ok  { background: var(--ok-bg);  border-color: var(--ok);  color: var(--ok); }
  .verdict.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .verdict.neutral { background: var(--neutral-bg); border-color: var(--neutral); color: var(--neutral); }
  .verdict h2 { margin: 0; font-size: 1.7rem; line-height: 1.15; font-weight: 700; }
  .verdict .prob { margin: 4px 0 14px; color: var(--ink); }
  .verdict .prob strong { font-size: 1.15rem; }
  .scale-wrap { padding-bottom: 20px; }
  .scale { position: relative; height: 10px; border-radius: 5px; background: var(--line); }
  .scale .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    min-width: 3px; border-radius: 5px;
    background: currentColor;
    transition: width 0.45s ease;
  }
  .scale .tick { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
  .scale .tick-label {
    position: absolute; top: 18px;
    transform: translateX(-50%);
    font-size: 0.72rem; color: var(--muted); white-space: nowrap;
  }
  .bars { display: grid; gap: 8px; margin: 0 0 4px; }
  .bar-row { display: grid; grid-template-columns: 4.6em 1fr 3.6em; align-items: center; gap: 8px; font-size: 0.85rem; }
  .bar-row span { color: var(--ink); }
  .bar-row .bar-pct { text-align: right; font-variant-numeric: tabular-nums; }
  .bar-row.lead { font-weight: 650; }
  .bar-row:not(.lead) .fill { background: var(--muted); opacity: 0.45; }
  .verdict .bar-row .scale { background: color-mix(in srgb, var(--ink) 14%, transparent); }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 12px 0 0; font-size: 0.85rem; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; }
  details { margin-top: 10px; font-size: 0.85rem; }
  summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  pre {
    margin: 8px 0 0; padding: 10px; max-height: 240px; overflow: auto;
    font: 0.78rem/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  .notice { border: 1px solid var(--bad); background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 12px 14px; font-weight: 600; }
  .notice p { margin: 0; }
  .note { margin: 10px 0 0; font-size: 0.85rem; color: var(--muted); }

  /* ---- Form ---- */
  .form-note { margin: 0 0 14px; color: var(--muted); max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .field.wide { grid-column: 1 / -1; }
  .field.invalid select, .field.invalid input, .field.invalid textarea { border-color: var(--bad); }
  .field .err { margin: 4px 0 0; font-size: 0.78rem; font-weight: 600; color: var(--bad); }

  @media (max-width: 880px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .rail { position: static; max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scale .fill { transition: none; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>ML Inference Server</h1>
  <p>One server, several trained models. Pick a project and a model, fill in the columns, then run a prediction.</p>
  <a href="/docs">API docs</a>
</header>

<main class="layout">
  <aside class="rail" aria-label="Prediction controls">
    <div>
      <label for="project">Project</label>
      <select id="project"></select>
      <p class="hint" id="project-desc"></p>
    </div>
    <div>
      <label for="model">Model</label>
      <select id="model"></select>
    </div>
    <div id="examples" hidden>
      <p class="group-title">Fill with an example</p>
      <div class="samples" id="samples"></div>
    </div>
    <div class="actions">
      <button class="primary" id="predict" type="submit" form="form">Predict</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <section id="result" aria-live="polite"><p class="empty">The prediction appears here.</p></section>
  </aside>

  <form id="form" novalidate>
    <p class="form-note" id="form-note"></p>
    <div class="grid" id="grid"></div>
  </form>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const els = {
  project: $("project"), desc: $("project-desc"), model: $("model"),
  examples: $("examples"), samples: $("samples"),
  predict: $("predict"), reset: $("reset"), result: $("result"),
  form: $("form"), note: $("form-note"), grid: $("grid"),
};
const state = { projects: [], project: null, fields: [] };

/* Small DOM helper: builds elements with textContent only, so API data is never parsed as HTML. */
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children) el.append(c);
  return el;
}

/* ---------- Loading projects and their columns ---------- */
async function init() {
  try {
    const res = await fetch("/projects");
    if (!res.ok) throw new Error("status " + res.status);
    state.projects = await res.json();
  } catch (e) {
    els.result.replaceChildren(problem("Could not load the project list. Check that the server is running, then reload."));
    return;
  }
  els.project.replaceChildren(...state.projects.map((p) => h("option", { value: p.id }, p.title)));
  await selectProject(state.projects[0].id);
}

async function selectProject(id) {
  state.project = state.projects.find((p) => p.id === id);
  els.project.value = id;
  els.desc.textContent = state.project.description;
  els.model.replaceChildren(...state.project.models.map((m) => h("option", { value: m.id }, m.label)));

  try {
    const res = await fetch(state.project.fields_url);
    if (!res.ok) throw new Error("status " + res.status);
    state.fields = await res.json();
  } catch (e) {
    els.grid.replaceChildren();
    els.result.replaceChildren(problem("Could not load the columns for this project."));
    return;
  }
  renderForm();
  renderSamples();
  clearResult();
}

/* ---------- Form ---------- */
function isSmallIntRange(f) {
  return f.kind === "int" && f.min !== undefined && f.max !== undefined && f.max - f.min <= 10;
}

function fieldControl(f, id) {
  if (f.kind === "text") {
    return h("textarea", {
      id, name: f.name, rows: "5", maxlength: f.max_length,
      placeholder: f.example !== undefined ? "e.g. " + f.example : "",
    });
  }
  if (f.kind === "choice" || isSmallIntRange(f)) {
    const values = f.kind === "choice"
      ? f.choices
      : Array.from({ length: f.max - f.min + 1 }, (_, i) => String(f.min + i));
    const sel = h("select", { id, name: f.name });
    if (f.default === undefined) sel.append(h("option", { value: "" }, "Select…"));
    for (const v of values) sel.append(h("option", { value: v }, v));
    return sel;
  }
  return h("input", {
    id, name: f.name, type: "number", inputmode: "decimal",
    min: f.min, max: f.max, step: f.kind === "int" ? "1" : "any",
    placeholder: f.example !== undefined ? "e.g. " + f.example : "",
  });
}

function hintText(f) {
  let text = f.desc;
  const isNumberBox = f.kind !== "text" && !(f.kind === "choice" || isSmallIntRange(f));
  if (isNumberBox) {
    if (f.min !== undefined && f.max !== undefined) text += " (" + f.min + " to " + f.max + ")";
    else if (f.min !== undefined) text += " (min " + f.min + ")";
  }
  return text;
}

function renderForm() {
  const cards = state.fields.map((f) => {
    const id = "f-" + f.name;
    const wrap = h("div", { class: f.kind === "text" ? "field wide" : "field", "data-name": f.name });
    wrap.append(h("label", { for: id }, f.name), fieldControl(f, id), h("p", { class: "hint" }, hintText(f)));
    return wrap;
  });
  els.grid.replaceChildren(...cards);
  setDefaults();
  els.note.textContent = state.fields.some((f) => f.required)
    ? "Every column needs a value. Start from an example, then change whatever you like."
    : "Prefilled with typical values. Change any column.";
}

function setDefaults() {
  for (const f of state.fields) {
    $("f-" + f.name).value = f.default === undefined ? "" : String(f.default);
  }
  clearErrors();
}

function renderSamples() {
  const samples = state.project.samples || [];
  els.examples.hidden = samples.length === 0;
  els.samples.replaceChildren(...samples.map((s) => {
    const b = h("button", { type: "button" }, s.name);
    b.addEventListener("click", () => applySample(s.values));
    return b;
  }));
}

function applySample(values) {
  setDefaults();
  for (const [name, value] of Object.entries(values)) {
    const el = $("f-" + name);
    if (el) el.value = String(value);
  }
  clearResult();
}

function collect() {
  const body = {};
  for (const f of state.fields) {
    const raw = $("f-" + f.name).value.trim();
    if (raw === "") continue;               // leave out; the server reports it if required
    body[f.name] = (f.kind === "choice" || f.kind === "text") ? raw : Number(raw);
  }
  return body;
}

/* ---------- Errors ---------- */
function clearErrors() {
  for (const el of els.grid.querySelectorAll(".field.invalid")) {
    el.classList.remove("invalid");
    el.querySelector("[aria-invalid]")?.removeAttribute("aria-invalid");
  }
  for (const el of els.grid.querySelectorAll(".err")) el.remove();
}

function problem(message) {
  return h("div", { class: "notice", role: "alert" }, h("p", {}, message));
}

function showFieldErrors(details) {
  clearErrors();
  const general = [];
  let first = null;
  for (const d of details) {
    const name = d.loc[d.loc.length - 1];
    const wrap = els.grid.querySelector('.field[data-name="' + CSS.escape(String(name)) + '"]');
    if (!wrap) { general.push(d.msg); continue; }
    wrap.classList.add("invalid");
    wrap.querySelector("select, input, textarea").setAttribute("aria-invalid", "true");
    wrap.append(h("p", { class: "err" }, d.type === "missing" ? "Required" : d.msg));
    first = first || wrap;
  }
  const count = details.length - general.length;
  const text = general.length ? general.join(" ") : (count === 1 ? "1 column needs attention." : count + " columns need attention.");
  els.result.replaceChildren(problem(text));
  first?.querySelector("select, input, textarea").focus();
}

/* ---------- Result ---------- */
function clearResult() {
  els.result.replaceChildren(h("p", { class: "empty" }, "The prediction appears here."));
}

function pretty(s) {
  const t = String(s).toLowerCase().replace(/_/g, " ");
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function percent(p) {
  const v = p * 100;
  return (v < 10 ? v.toFixed(2) : v.toFixed(1)) + "%";
}

/* One bar per class, for projects that answer with several probabilities (e.g. negative / neutral / positive). */
function classBars(probabilities, top) {
  const bars = h("div", { class: "bars" });
  const fills = [];
  for (const [name, p] of Object.entries(probabilities)) {
    const fill = h("div", { class: "fill", style: "width:0%" });
    fills.push([fill, p]);
    bars.append(h("div", { class: name === top ? "bar-row lead" : "bar-row" },
      h("span", {}, pretty(name)), h("div", { class: "scale" }, fill), h("span", { class: "bar-pct" }, percent(p))));
  }
  requestAnimationFrame(() => { for (const [fill, p] of fills) fill.style.width = Math.max(p * 100, 0) + "%"; });
  return bars;
}

function showResult(data, url, body) {
  const probKey = Object.keys(data).find((k) => k.endsWith("_probability"));
  const p = probKey ? data[probKey] : null;
  // Projects may say how to colour the answer ("ok" | "bad" | "neutral"); otherwise 1 means the risky outcome.
  const tone = data.tone || (data.prediction === 1 ? "bad" : "ok");

  const verdict = h("div", { class: "verdict " + tone });
  verdict.append(h("h2", {}, pretty(data.label)));

  if (data.probabilities && typeof data.probabilities === "object") {
    verdict.append(h("p", { class: "prob" }, h("strong", {}, percent(data.confidence)), " confident"));
    verdict.append(classBars(data.probabilities, data.prediction));
  }

  if (p !== null) {
    verdict.append(h("p", { class: "prob" },
      h("strong", {}, percent(p)), " " + probKey.replace("_probability", "") + " probability (" + p + ")"));
    const scale = h("div", { class: "scale" });
    scale.append(h("div", { class: "fill", style: "width:0%" }));
    if (typeof data.threshold === "number") {
      const left = (data.threshold * 100) + "%";
      scale.append(h("div", { class: "tick", style: "left:" + left }),
                   h("div", { class: "tick-label", style: "left:" + left }, "decision threshold " + data.threshold));
    }
    verdict.append(h("div", { class: "scale-wrap" }, scale));
    requestAnimationFrame(() => { scale.querySelector(".fill").style.width = Math.max(p * 100, 0) + "%"; });
  }

  const meta = h("dl", { class: "meta" },
    h("dt", {}, "Project"), h("dd", {}, state.project.title),
    h("dt", {}, "Model"), h("dd", {}, els.model.selectedOptions[0].textContent));
  if (typeof data.cleaned_text === "string") {
    meta.append(h("dt", {}, "Words used"), h("dd", {}, data.cleaned_text));
    if (typeof data.words_recognized === "number") {
      meta.append(h("dt", {}, "Known words"), h("dd", {}, data.words_recognized + " of " + data.words_in_text));
    }
  }
  meta.append(h("dt", {}, "Time taken"), h("dd", {}, data.latency_ms + " ms"));

  const details = h("details", {}, h("summary", {}, "Request sent"),
    h("pre", {}, "POST " + url + "\n" + JSON.stringify(body, null, 2)));

  const parts = [verdict, meta];
  if (Array.isArray(data.fields_defaulted) && data.fields_defaulted.length) {
    parts.push(h("p", { class: "note" }, data.fields_defaulted.length + " columns were left empty and used default values."));
  }
  parts.push(details);
  els.result.replaceChildren(...parts);

  if (window.matchMedia("(max-width: 880px)").matches) {
    const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    els.result.scrollIntoView({ block: "nearest", behavior: calm ? "auto" : "smooth" });
  }
}

/* ---------- Predict ---------- */
async function predict(ev) {
  ev.preventDefault();
  clearErrors();
  const body = collect();
  const url = state.project.predict_url.replace("{model}", encodeURIComponent(els.model.value));
  els.predict.disabled = true;
  els.predict.textContent = "Predicting…";
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => null);
    if (res.ok && data) showResult(data, url, body);
    else if (res.status === 422 && data && Array.isArray(data.detail)) showFieldErrors(data.detail);
    else if (res.status === 503) els.result.replaceChildren(problem("This model is not available on the server right now. Its files may be missing."));
    else els.result.replaceChildren(problem((data && typeof data.detail === "string") ? data.detail : "The server returned an error (" + res.status + ")."));
  } catch (e) {
    els.result.replaceChildren(problem("Could not reach the server. Check that it is running, then try again."));
  } finally {
    els.predict.disabled = false;
    els.predict.textContent = "Predict";
  }
}

els.form.addEventListener("submit", predict);
els.reset.addEventListener("click", () => { setDefaults(); clearResult(); });
els.project.addEventListener("change", () => selectProject(els.project.value));
init();
</script>
</body>
</html>
